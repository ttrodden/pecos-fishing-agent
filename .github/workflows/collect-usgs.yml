name: Collect Pecos USGS Data

on:
  workflow_dispatch:
  schedule:
    - cron: '15 10,11 * * *'

permissions:
  contents: write

concurrency:
  group: pecos-usgs-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check Mountain Time
        id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$(TZ=America/Denver date +%H)" = "04" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Retrieve and validate USGS observations
        if: steps.clock.outputs.run == 'true'
        run: python scripts/collect_usgs.py

      - name: Commit verified measurements
        if: steps.clock.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Pecos USGS observations"
            git push
          fi

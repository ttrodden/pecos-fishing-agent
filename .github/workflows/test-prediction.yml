name: Test Pecos Flow Prediction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-prediction:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Cowles flow prediction
        run: python scripts/predict_flow.py

      - name: Display prediction results
        run: |
          python -m json.tool data/forecast.json

      - name: Save prediction results
        uses: actions/upload-artifact@v4
        with:
          name: pecos-flow-prediction-test
          path: data/forecast.json
          retention-days: 14

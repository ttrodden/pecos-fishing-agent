name: Verify Pecos watershed boundaries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mapping dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests shapely folium

      - name: Verify watershed boundaries
        run: |
          python scripts/verify_watersheds.py --upper-pecos-lat 35.7765694 --upper-pecos-lon -105.6602806 --rio-mora-outlet-lat 35.7763278 --rio-mora-outlet-lon -105.6598278

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pecos-watershed-verification
          path: |
            watershed_verification/
            watershed_results/
          if-no-files-found: warn
          retention-days: 30
